name: Correção única - prioridade da categoria Tipo

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-category.yml'

permissions:
  contents: write

jobs:
  fix-category:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir classificação por Tipo
        shell: python
        run: |
          from pathlib import Path

          path = Path('public/script.js')
          text = path.read_text(encoding='utf-8')

          old = '''  function classify(r){const type=norm(r.Tipo),dec=norm(r["Última Decisão"]),crit=norm(r.Critério);if(type==="EF")return"EF";if(crit.includes("CLIENTE ANA PAULA")||crit==="ANA")return"ANA";if(crit.includes("CLIENTE FLAVIO")||crit==="FLAVIO")return"FLAVIO";if(crit.includes("NADJA - SOLICITOU FICAR FLAVIO")||crit.includes("NADJA/FLAVIO"))return"NADJA/FLAVIO";if(crit==="NADJA")return"NADJA";if(crit.includes("COMPROMET")||crit.includes("COMPREMET"))return"COMPROMETIDO";if(dec==="IMPROCEDENTE")return"IMPROCEDENTE";if(type==="ED")return"ED";if(type==="EP")return"EP";return"ALEATORIO";}'''

          new = '''  function classify(r){const type=norm(r.Tipo),dec=norm(r["Última Decisão"]),crit=norm(r.Critério);if(type==="ANA MULLER"||type==="ANA")return"ANA";if(type==="FLAVIO MARQUES"||type==="FLAVIO")return"FLAVIO";if(type==="NADJA/FLAVIO")return"NADJA/FLAVIO";if(type==="NADJA"||type==="NADJA/ANA")return"NADJA";if(type==="COMPROMETIDO")return"COMPROMETIDO";if(type==="IMPROCEDENTE")return"IMPROCEDENTE";if(type==="EF")return"EF";if(type==="ED")return"ED";if(type==="EP")return"EP";if(type==="ALEATORIO")return"ALEATORIO";if(crit.includes("CLIENTE ANA PAULA")||crit==="ANA")return"ANA";if(crit.includes("CLIENTE FLAVIO")||crit==="FLAVIO")return"FLAVIO";if(crit.includes("NADJA - SOLICITOU FICAR FLAVIO")||crit.includes("NADJA/FLAVIO"))return"NADJA/FLAVIO";if(crit==="NADJA")return"NADJA";if(crit.includes("COMPROMET")||crit.includes("COMPREMET"))return"COMPROMETIDO";if(dec==="IMPROCEDENTE")return"IMPROCEDENTE";if(type==="ED")return"ED";if(type==="EP")return"EP";return"ALEATORIO";}'''

          if old not in text:
              raise SystemExit('Trecho original classify não encontrado; nenhuma alteração aplicada.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit da correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/script.js
          git commit -m "Corrige classificação para priorizar Tipo"
          git push
